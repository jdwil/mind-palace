AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mind Palace - Wiki-style knowledge base infrastructure for LLM agents

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  
  PagesBucketName:
    Type: String
    Default: ''
    Description: S3 bucket name for page content (auto-generated if empty)

  VectorBucketName:
    Type: String
    Default: ''
    Description: S3 vector bucket name (auto-generated if empty)

  VectorIndexName:
    Type: String
    Default: wiki-pages

  EmbeddingDimensions:
    Type: Number
    Default: 1024
    Description: Embedding dimensions (1024 for Titan Embeddings v2)

Conditions:
  GeneratePagesBucketName: !Equals [!Ref PagesBucketName, '']
  GenerateVectorBucketName: !Equals [!Ref VectorBucketName, '']

Resources:
  # --- S3 Bucket for page content ---
  PagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - GeneratePagesBucketName
        - !Sub 'mind-palace-pages-${Environment}-${AWS::AccountId}'
        - !Ref PagesBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: mind-palace
        - Key: Environment
          Value: !Ref Environment

  # --- DynamoDB Table for graph metadata ---
  GraphTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mind-palace-graph-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: mind-palace
        - Key: Environment
          Value: !Ref Environment

  # --- S3 Vector Bucket for semantic search ---
  VectorBucket:
    Type: AWS::S3::VectorBucket
    Properties:
      VectorBucketName: !If
        - GenerateVectorBucketName
        - !Sub 'mind-palace-vectors-${Environment}-${AWS::AccountId}'
        - !Ref VectorBucketName

  VectorIndex:
    Type: AWS::S3::VectorIndex
    DependsOn: VectorBucket
    Properties:
      VectorBucketName: !If
        - GenerateVectorBucketName
        - !Sub 'mind-palace-vectors-${Environment}-${AWS::AccountId}'
        - !Ref VectorBucketName
      VectorIndexName: !Ref VectorIndexName
      Dimensions: !Ref EmbeddingDimensions
      DistanceMetric: cosine

  # --- IAM Policy for Mind Palace runtime ---
  MindPalacePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'mind-palace-runtime-${Environment}'
      Description: Permissions for Mind Palace runtime access
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3Pages
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetObjectVersion
            Resource:
              - !GetAtt PagesBucket.Arn
              - !Sub '${PagesBucket.Arn}/*'
          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:GetItem
            Resource:
              - !GetAtt GraphTable.Arn
          - Sid: S3Vectors
            Effect: Allow
            Action:
              - s3vectors:PutVectors
              - s3vectors:QueryVectors
              - s3vectors:DeleteVectors
              - s3vectors:GetVectors
            Resource: '*'
          - Sid: Bedrock
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'

Outputs:
  PagesBucketName:
    Description: S3 bucket for wiki page content
    Value: !Ref PagesBucket

  GraphTableName:
    Description: DynamoDB table for graph metadata
    Value: !Ref GraphTable

  VectorBucketName:
    Description: S3 vector bucket for embeddings
    Value: !If
      - GenerateVectorBucketName
      - !Sub 'mind-palace-vectors-${Environment}-${AWS::AccountId}'
      - !Ref VectorBucketName

  VectorIndexName:
    Description: Vector index name
    Value: !Ref VectorIndexName

  PolicyArn:
    Description: IAM policy ARN to attach to your runtime role
    Value: !Ref MindPalacePolicy

  Configuration:
    Description: Paste this into your Rust config
    Value: !Sub |
      S3Config { bucket_name: "${PagesBucket}", region: "${AWS::Region}", prefix: "v1" }
      DynamoConfig { table_name: "${GraphTable}", region: "${AWS::Region}" }
      S3VectorsConfig { bucket_name: "mind-palace-vectors-${Environment}-${AWS::AccountId}", index_name: "${VectorIndexName}", region: "${AWS::Region}" }
      BedrockConfig { model_id: "amazon.titan-embed-text-v2:0", region: "${AWS::Region}" }
